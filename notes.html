<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse — Notes</title>

    <script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --rb-red: #db0a40;
            --rb-blue: #002b5c;
            --rb-silver: #c9ced6;
            --rb-darker: #05070a;
            --rb-yellow: #ffcc00;
            --accent: var(--rb-red);
            --text: #f4f5f7;
            --text-secondary: #c9ced6;
            --text-muted: #6a7280;
            --surface: #0f1216;
            --surface-alt: #151921;
            --surface-elevated: #12161c;
            --border: rgba(255,255,255,0.10);
            --border-light: rgba(255,255,255,0.05);
            --accent-pale: rgba(219,10,64,0.08);
            --accent-glow: rgba(219,10,64,0.22);
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.3);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
            --shadow: 0 4px 16px rgba(0,0,0,0.5);
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.65);
            --shadow-xl: 0 24px 64px rgba(0,0,0,0.75);
            --transition: 0.25s cubic-bezier(0.4,0,0.2,1);

            --font-display: 'Anton', 'Arial Narrow', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'Consolas', monospace;

            --focus-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --focus-dim: 0.25;
            --focus-blur: 6px;
        }
        body.light {
            --rb-darker: #f4f5f7;
            --text: #0b0d10; --text-secondary: #3a3f47; --text-muted: #6a7280;
            --surface: #ffffff; --surface-alt: #f4f5f7; --surface-elevated: #ffffff;
            --border: rgba(0,0,0,0.10); --border-light: rgba(0,0,0,0.05);
            --accent-pale: rgba(219,10,64,0.06);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-body);
            background: var(--rb-darker);
            color: var(--text);
            line-height: 1.55;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ══ NAV ══ */
        .rb-nav {
            position: sticky; top: 0; z-index: 101;
            display: flex; align-items: center; justify-content: space-between;
            padding: 1rem 2rem;
            background: var(--rb-darker);
            border-bottom: 1px solid var(--border);
        }
        .rb-logo {
            font-family: var(--font-display);
            font-weight: 400; font-size: 1.6rem;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--text); text-decoration: none; line-height: 1;
        }
        .rb-logo span { color: var(--rb-red); }
        .rb-nav-links { display: flex; gap: 0.4rem; }
        .rb-nav-links a {
            font-family: var(--font-mono);
            color: var(--text-secondary); text-decoration: none;
            font-weight: 500; font-size: 0.78rem;
            letter-spacing: 1.5px; text-transform: uppercase;
            padding: 0.55rem 1.1rem; position: relative;
            transition: var(--transition);
        }
        .rb-nav-links a::after {
            content: ""; position: absolute; left: 1.1rem; right: 1.1rem; bottom: 0.25rem;
            height: 2px; background: var(--rb-red);
            transform: scaleX(0); transform-origin: left;
            transition: transform 0.3s;
        }
        .rb-nav-links a:hover { color: var(--text); }
        .rb-nav-links a:hover::after,
        .rb-nav-links a.active::after { transform: scaleX(1); }
        .rb-nav-links a.active { color: var(--text); }

        /* ══ HEADER ══ */
        .header { background: var(--rb-darker); border-bottom: 1px solid var(--border); padding: 0 2rem; }
        .header-inner { max-width: 1440px; margin: 0 auto; display: flex; align-items: center; justify-content: flex-end; height: 56px; gap: 1rem; }
        .header-actions { display: flex; align-items: center; gap: 0.5rem; margin-left: auto; }

        /* ══ BUTTONS ══ */
        .btn {
            font-family: var(--font-display);
            padding: 0.55rem 1.2rem;
            font-weight: 400; font-size: 0.82rem;
            letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; border: none;
            transition: var(--transition);
            display: inline-flex; align-items: center; gap: 0.35rem;
            clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
            line-height: 1;
        }
        .btn:active { transform: scale(0.96); }
        .btn-ghost { background: transparent; color: var(--text-secondary); border: 1.5px solid var(--border); }
        .btn-ghost:hover { background: var(--surface-alt); color: var(--text); border-color: var(--text-muted); }
        .btn-accent { background: var(--rb-red); color: #fff; box-shadow: 0 2px 12px rgba(219,10,64,0.4); }
        .btn-accent:hover { background: #ff1150; transform: translateY(-2px); }
        .btn-icon {
            width: 40px; height: 40px; background: transparent;
            border: 1.5px solid var(--border); color: var(--text-secondary); cursor: pointer; font-size: 1rem;
            display: flex; align-items: center; justify-content: center; transition: var(--transition);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
        }
        .btn-icon:hover { background: var(--surface-alt); border-color: var(--rb-red); color: var(--rb-red); }

        /* ══ SEARCH + SEM TABS ══ */
        .global-search-wrap {
            background: var(--rb-darker); border-bottom: 1px solid var(--border);
            padding: 0.8rem 1.5rem;
            display: flex; align-items: center; justify-content: center;
        }
        .global-search-inner { position: relative; width: 100%; max-width: 600px; }
        .global-search-inner input {
            width: 100%; padding: 0.7rem 1.2rem 0.7rem 2.6rem;
            font-family: var(--font-body);
            border: 1.5px solid var(--border); border-radius: 2px;
            background: var(--surface-alt); color: var(--text);
            font-size: 0.88rem; outline: none; transition: var(--transition);
        }
        .global-search-inner input:focus { border-color: var(--rb-red); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-glow); }
        .global-search-inner .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem; pointer-events: none; }
        .global-search-inner .clear-btn { position: absolute; right: 0.8rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; }
        .clear-btn:hover { color: var(--text); }

        .semester-nav {
            background: var(--rb-darker); border-bottom: 1px solid var(--border);
            padding: 0.6rem 1.5rem;
            display: flex; gap: 0.4rem;
            overflow-x: auto; scrollbar-width: none;
        }
        .semester-nav::-webkit-scrollbar { display: none; }
        .sem-tab {
            font-family: var(--font-mono);
            padding: 0.5rem 1.1rem; border: 1.5px solid var(--border);
            background: transparent; color: var(--text-secondary);
            font-weight: 600; font-size: 0.75rem;
            cursor: pointer; white-space: nowrap; transition: var(--transition);
            letter-spacing: 1.5px; text-transform: uppercase;
            clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
        }
        .sem-tab:hover { background: var(--surface-alt); color: var(--text); border-color: var(--rb-red); }
        .sem-tab.active { background: var(--rb-red); color: #fff; border-color: var(--rb-red); }
        .sem-tab .badge { display: inline-block; background: rgba(255,255,255,0.2); padding: 0.1rem 0.4rem; margin-left: 0.3rem; font-size: 0.62rem; }

        /* ══ MAIN ══ */
        .main-container { max-width: 1440px; margin: 0 auto; padding: 2.5rem 2rem 4rem; }

        .semester-panel { animation: fadeSlideIn 0.4s ease forwards; }
        @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .card-enter { animation: cardEnter 0.5s ease forwards; opacity: 0; }
        @keyframes cardEnter { from { opacity: 0; transform: translateY(24px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .semester-header { margin-bottom: 2rem; text-align: center; }
        .semester-title {
            font-family: var(--font-display);
            font-weight: 400; font-size: 2.8rem;
            color: var(--text); margin-bottom: 0.4rem;
            letter-spacing: 2px; text-transform: uppercase;
            line-height: 1;
        }
        .semester-title::before, .semester-title::after {
            content: ""; display: inline-block; width: 40px; height: 3px;
            background: var(--rb-red); vertical-align: middle;
            margin: 0 1rem; transform: skewX(-18deg);
        }
        .semester-subtitle { font-family: var(--font-mono); color: var(--text-muted); font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; }
        .search-bar { max-width: 420px; margin: 0 auto 1.8rem; }
        .search-bar input {
            width: 100%; padding: 0.7rem 1.2rem;
            font-family: var(--font-body);
            border: 1.5px solid var(--border); border-radius: 2px;
            font-size: 0.9rem; background: var(--surface);
            color: var(--text); outline: none;
            transition: var(--transition);
        }
        .search-bar input:focus { border-color: var(--rb-red); box-shadow: 0 0 0 4px var(--accent-glow); }

        /* ══ SUBJECT GRID ══ */
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1rem;
            transition: filter 0.4s ease, opacity 0.4s ease;
        }
        body.focus-mode .subjects-grid { filter: blur(var(--focus-blur)); opacity: var(--focus-dim); pointer-events: none; }
        body.focus-mode .rb-nav,
        body.focus-mode .header,
        body.focus-mode .global-search-wrap,
        body.focus-mode .semester-nav { filter: blur(var(--focus-blur)); opacity: var(--focus-dim); pointer-events: none; }

        .elective-group-label {
            grid-column: 1/-1;
            font-family: var(--font-mono);
            font-weight: 600; font-size: 0.85rem;
            color: var(--rb-red); margin: 2rem 0 0.5rem; padding-bottom: 0.4rem;
            border-bottom: 2px solid var(--rb-red);
            text-align: center; letter-spacing: 3px; text-transform: uppercase;
        }

        .subject-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 4px solid var(--rb-red);
            overflow: hidden; cursor: pointer;
            transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s;
            clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
            will-change: transform, box-shadow;
        }
        .subject-card:hover { border-left-color: var(--rb-yellow); box-shadow: var(--shadow-lg); transform: translateY(-3px); }
        .subject-card.hidden-card { display: none; }

        /* ── FOCUS MODE OVERLAY ── */
        .focus-overlay {
            position: fixed; inset: 0; z-index: 300;
            background: rgba(5,7,10,0.55);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            opacity: 0; pointer-events: none;
            transition: opacity 0.35s ease;
            display: flex; align-items: flex-start; justify-content: center;
            padding: 4rem 2rem 4rem;
            overflow-y: auto;
            overscroll-behavior: contain;
        }
        .focus-overlay.open { opacity: 1; pointer-events: auto; }
        body.light .focus-overlay { background: rgba(244,245,247,0.6); }

        .focus-card {
            width: 100%; max-width: 1100px;
            background: var(--surface-elevated);
            border: 1.5px solid var(--rb-red);
            border-left: 6px solid var(--rb-red);
            box-shadow: var(--shadow-xl);
            clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 26px 100%, 0 calc(100% - 26px));
            transform: scale(0.85) translateY(40px);
            opacity: 0;
            transition: transform 0.55s var(--focus-spring), opacity 0.35s ease;
            position: relative;
            overflow: hidden;
        }
        .focus-overlay.open .focus-card { transform: scale(1) translateY(0); opacity: 1; }
        .focus-card.closing { transform: scale(0.85) translateY(40px); opacity: 0; transition: transform 0.35s ease, opacity 0.25s ease; }
        .focus-scan {
            position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent 0%, var(--rb-red) 20%, var(--rb-yellow) 50%, var(--rb-red) 80%, transparent 100%);
            transform-origin: left; transform: scaleX(0); opacity: 0;
        }
        .focus-overlay.open .focus-scan { animation: scanSweep 0.9s cubic-bezier(0.4, 0, 0.2, 1) 0.1s forwards; }
        @keyframes scanSweep {
            0%   { transform: scaleX(0); opacity: 1; }
            70%  { transform: scaleX(1); opacity: 1; }
            100% { transform: scaleX(1); opacity: 0; }
        }

        .focus-header {
            padding: 2rem 2.2rem 1.4rem;
            border-bottom: 1px solid var(--border-light);
            display: flex; align-items: flex-start; justify-content: space-between; gap: 1.5rem;
            position: relative;
        }
        .focus-header-left { flex: 1; min-width: 0; }
        .focus-subject-title {
            font-family: var(--font-display);
            font-weight: 400;
            font-size: clamp(1.4rem, 3vw, 2.2rem);
            line-height: 1.05; letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text); margin-bottom: 0.6rem;
        }
        .focus-subject-code {
            font-family: var(--font-mono);
            font-size: 0.8rem; color: var(--text-muted);
            letter-spacing: 2px; text-transform: uppercase;
            font-weight: 500;
            display: inline-block; padding: 0.25rem 0.6rem;
            background: var(--surface-alt);
            border: 1px solid var(--border);
        }
        .focus-close {
            width: 40px; height: 40px;
            background: transparent; border: 1.5px solid var(--border);
            color: var(--text-secondary); cursor: pointer; font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition); flex-shrink: 0;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
        }
        .focus-close:hover { border-color: var(--rb-red); color: var(--rb-red); transform: rotate(90deg); }

        .focus-body {
            padding: 1.6rem 2.2rem 2.2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
        }
        .focus-body > * {
            opacity: 0; transform: translateX(-12px);
            animation: cascadeIn 0.45s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes cascadeIn { to { opacity: 1; transform: translateX(0); } }

        /* ══ NOTE CATEGORIES ══ */
        .grouped-section {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-left: 3px solid var(--rb-blue);
            overflow: hidden;
            transition: var(--transition);
        }
        .grouped-section-header {
            padding: 0.7rem 0.9rem; cursor: pointer;
            display: flex; align-items: center; justify-content: space-between;
            font-family: var(--font-mono);
            font-weight: 600; font-size: 0.72rem; color: var(--text);
            text-transform: uppercase; letter-spacing: 1.5px;
            user-select: none; transition: var(--transition);
        }
        .grouped-section-header:hover { background: var(--accent-pale); }
        .grouped-section-chevron { font-size: 0.6rem; transition: var(--transition); }
        .grouped-section.open .grouped-section-chevron { transform: rotate(180deg); }
        .grouped-section-body { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
        .grouped-section.open .grouped-section-body { max-height: 600px; }
        .grouped-section-body-inner { padding: 0 0.9rem 0.7rem; }

        .note-category {
            background: var(--surface);
            padding: 0.7rem;
            border: 1px solid var(--border-light);
            transition: var(--transition);
        }
        .note-category:hover { border-color: var(--border); }
        .note-cat-title {
            font-family: var(--font-mono);
            font-weight: 600; font-size: 0.62rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            text-transform: uppercase; letter-spacing: 1.5px;
        }
        .file-link {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.5rem 0.7rem; margin: 0.2rem 0;
            background: var(--surface-alt);
            font-family: var(--font-body);
            font-size: 0.82rem; color: var(--text);
            text-decoration: none; cursor: pointer;
            transition: var(--transition); font-weight: 500;
            white-space: nowrap; overflow: hidden;
            border-left: 2px solid transparent;
        }
        .file-link:hover {
            background: var(--accent-pale);
            color: var(--rb-red);
            border-left-color: var(--rb-red);
            transform: translateX(3px);
        }
        .file-icon { font-size: 0.9rem; flex-shrink: 0; }
        .file-label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }

        /* ── NEW: "Open ↗" hint ── */
        .file-view-hint {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 0.15rem 0.5rem;
            border: 1px solid var(--border);
            transition: var(--transition);
            flex-shrink: 0;
            line-height: 1;
        }
        .file-link:hover .file-view-hint {
            color: #fff;
            background: var(--rb-red);
            border-color: var(--rb-red);
        }

        /* ── NEW: quiet download button ── */
        .file-download-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            width: 24px; height: 24px;
            cursor: pointer; font-size: 0.65rem;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition); flex-shrink: 0;
            line-height: 1;
        }
        .file-download-btn:hover {
            background: var(--rb-red);
            color: #fff;
            border-color: var(--rb-red);
            transform: scale(1.1);
        }

        .no-files { color: var(--text-muted); font-style: italic; font-size: 0.68rem; }
        .sub-cat-title {
            font-family: var(--font-mono);
            font-weight: 600; font-size: 0.6rem;
            color: var(--text-secondary);
            margin-bottom: 0.2rem;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .new-badge {
            display: inline-block;
            background: var(--rb-yellow); color: #000;
            padding: 0.1rem 0.4rem;
            font-family: var(--font-mono);
            font-size: 0.55rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px;
            animation: newPulse 2s ease infinite; flex-shrink: 0;
        }
        @keyframes newPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

        /* ══ BACK TO TOP ══ */
        .back-to-top {
            position: fixed; bottom: 2.5rem; right: 2.5rem; width: 44px; height: 44px;
            background: var(--surface); border: 1.5px solid var(--border);
            color: var(--text-secondary); cursor: pointer; font-size: 1rem;
            z-index: 99; transition: var(--transition);
            opacity: 0; pointer-events: none; transform: translateY(10px);
            display: flex; align-items: center; justify-content: center;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
        }
        .back-to-top.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .back-to-top:hover { border-color: var(--rb-red); color: var(--rb-red); transform: translateY(-3px); }

        /* ══ MODALS ══ */
        .modal-overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 400; padding: 1.5rem; background: rgba(0,0,0,0.75); }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--surface); padding: 2rem;
            border-radius: 4px; width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto;
            border: 1px solid var(--border);
            border-top: 4px solid var(--rb-red);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal h3 {
            font-family: var(--font-display);
            font-weight: 400; color: var(--text);
            margin-bottom: 1.2rem; text-align: center;
            letter-spacing: 2px; text-transform: uppercase;
        }
        .modal input, .modal select, .modal textarea {
            width: 100%; padding: 0.6rem 0.8rem; margin: 0.25rem 0 0.6rem;
            font-family: var(--font-body);
            border: 1.5px solid var(--border); border-radius: 2px;
            background: var(--surface-alt); color: var(--text);
            font-size: 0.85rem; transition: var(--transition);
        }
        .modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--rb-red); outline: none; box-shadow: 0 0 0 3px var(--accent-glow); }
        .modal textarea { resize: vertical; min-height: 80px; }
        .modal-close { float: right; background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--text-muted); transition: var(--transition); }
        .modal-close:hover { color: var(--text); }

        /* ══ MOBILE NAV ══ */
        .mobile-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--rb-darker); border-top: 1px solid var(--border); z-index: 95; padding: 0.5rem 1rem; }

        .toast-container { position: fixed; bottom: 5rem; right: 1.5rem; z-index: 500; display: flex; flex-direction: column; gap: 0.4rem; }
        .toast {
            background: var(--rb-red); color: #fff;
            padding: 0.6rem 1.1rem;
            font-family: var(--font-mono);
            font-size: 0.72rem; font-weight: 600;
            letter-spacing: 1.5px; text-transform: uppercase;
            animation: toastIn 0.3s ease;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .kc-toast {
            position: fixed; bottom: 50%; left: 50%; transform: translate(-50%,50%);
            background: var(--rb-red); color: #fff;
            padding: 1.2rem 2rem;
            font-family: var(--font-display);
            font-size: 1.4rem; font-weight: 400;
            z-index: 600; pointer-events: none; opacity: 0;
            transition: opacity 0.15s;
            letter-spacing: 3px; text-transform: uppercase;
        }
        .kc-toast.show { opacity: 1; }

        /* ══ MOUSE EDGE NAV ══ */
        .rb-edge-nav { position: fixed; top: 50%; z-index: 150; width: 64px; height: 200px; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity 0.3s, transform 0.3s; }
        .rb-edge-nav.left  { left: 0;  transform: translate(-30px, -50%); }
        .rb-edge-nav.right { right: 0; transform: translate(30px, -50%); }
        .rb-edge-nav.visible.left  { opacity: 1; transform: translate(0, -50%); }
        .rb-edge-nav.visible.right { opacity: 1; transform: translate(0, -50%); }
        .rb-edge-nav .edge-pill {
            display: flex; flex-direction: column; align-items: center; gap: 0.6rem;

            padding: 1rem 0.7rem; color: var(--text);
            font-family: var(--font-display);
            font-weight: 400; font-size: 0.8rem;
            letter-spacing: 2px; text-transform: uppercase;
            writing-mode: vertical-rl;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
            transition: var(--transition); line-height: 1;
        }
        .rb-edge-nav.right .edge-pill { transform: rotate(180deg); }
        .rb-edge-nav:hover .edge-pill { background: var(--rb-red); color: #fff; }
        .rb-edge-nav .edge-ring { position: absolute; inset: 0; pointer-events: none; }
        .rb-edge-nav .edge-ring circle {
            fill: none; stroke: var(--rb-red); stroke-width: 3;
            stroke-dasharray: 126; stroke-dashoffset: 126;
            transition: stroke-dashoffset 0.15s linear;

        @media (max-width: 768px) {

        const IC=[{key:'unit1',label:'Unit 1'},{key:'unit2',label:'Unit 2'},{key:'unit3',label:'Unit 3'},{key:'unit4',label:'Unit 4'},{key:'unit5',label:'Unit 5'},{key:'textbook',label:'Textbook'}];
        const GC=[{gk:'cie',gl:'CIE Papers',sc:[{key:'cie1',label:'CIE 1'},{key:'cie2',label:'CIE 2'},{key:'cie3',label:'CIE 3'}]},{gk:'endsem',gl:'Endsem Papers',sc:[{key:'endsem',label:'Endsem'}]}];
        const LIC=[{key:'labmanual',label:'Lab Manual'}];
        function isLab(t){return t.toLowerCase().includes('lab');}
        let nd={},cs='3',gf='';

        async function fln(){try{const r=await fetch('./notes-data.json');if(r.ok)nd=await r.json();else nd=JSON.parse(localStorage.getItem('bn')||'{}');}catch(e){nd=JSON.parse(localStorage.getItem('bn')||'{}');}const s=document.getElementById('loadingSkeleton');if(s)s.style.display='none';renderAll();maybeOpenFromHash();}
        function sl(){localStorage.setItem('bn',JSON.stringify(nd));}
        function gk(s,c,cat){return`${s}|${c}|${cat}`;}
        function gn(s,c,cat){return nd[gk(s,c,cat)]||[];}

        // ══ NEW: open file in Google Drive (like clicking a file in Drive) ══
        function openInDrive(driveUrl){
            const id = extractFileId(driveUrl);
            if (!id) return showToast('Invalid Drive link');
            window.open(`https://drive.google.com/file/d/${id}/view`, '_blank', 'noopener');
        }

        // ══ FOCUS MODE ══
        const focusOverlay = document.getElementById('focusOverlay');
        const focusCard    = document.getElementById('focusCard');
        const focusBody    = document.getElementById('focusBody');
        const focusTitleEl = document.getElementById('focusSubjectTitle');
        const focusCodeEl  = document.getElementById('focusSubjectCode');
        let lastScrollY = 0;
        let currentFocusCode = null;
        let focusOpen = false;

        function findSubjectByCode(code){
            for (let s=3;s<=8;s++){
                const sub = gas(s).find(x=>x.code===code);
                if (sub) return { sem: s, sub };
            }
            return null;
        }

        function openFocus(sem, code, pushHistory=true){
            const found = findSubjectByCode(code);
            if (!found) return;
            currentFocusCode = code;
            cs = String(sem);
            lastScrollY = window.scrollY;
            focusTitleEl.textContent = found.sub.title;
            focusCodeEl.textContent = found.sub.code;
            focusBody.innerHTML = buildFocusBody(found.sem, found.sub);
            [...focusBody.children].forEach((el, i) => {
                el.style.animationDelay = (0.12 + i * 0.06) + 's';
            });
            document.body.classList.add('focus-mode');
            focusOverlay.classList.add('open');
            focusOpen = true;
            document.body.style.overflow = 'hidden';
            if (pushHistory && location.hash !== '#subject=' + code) {
                history.pushState({ focus: code }, '', '#subject=' + code);
            }
            setTimeout(() => document.getElementById('focusCloseBtn').focus(), 100);
            focusOverlay.scrollTop = 0;
        }

        function closeFocus(pushHistory=true){
            if (!focusOpen) return;
            focusOpen = false;
            focusCard.classList.add('closing');
            setTimeout(() => {
                focusOverlay.classList.remove('open');
                focusCard.classList.remove('closing');
                document.body.classList.remove('focus-mode');
                document.body.style.overflow = '';
                window.scrollTo({ top: lastScrollY, behavior: 'auto' });
                setTimeout(() => { focusBody.innerHTML = ''; focusTitleEl.textContent=''; focusCodeEl.textContent=''; }, 200);
            }, 320);
            currentFocusCode = null;
            if (pushHistory && location.hash.startsWith('#subject=')) {
                history.pushState({}, '', location.pathname + location.search);
            }
        }

        function buildFocusBody(sem, sub){
            const ic = isLab(sub.title) ? LIC : IC;
            const gc = isLab(sub.title) ? [] : GC;
            let html = '';
            ic.forEach(c => {
                const notes = gn(sem, sub.code, c.key);
                html += buildCategory(c.label, notes);
            });
            gc.forEach(g => {
                const allNotes = g.sc.flatMap(sc => gn(sem, sub.code, sc.key));
                const hasContent = allNotes.length > 0;
                html += `<div class="grouped-section" data-group="${g.gk}">
                    <div class="grouped-section-header" onclick="this.parentElement.classList.toggle('open')">
                        <span>${g.gl}${hasContent ? ' (' + allNotes.length + ')' : ''}</span>
                        <span class="grouped-section-chevron">▾</span>
                    </div>
                    <div class="grouped-section-body">
                        <div class="grouped-section-body-inner">
                            ${g.sc.map(sc => {
                                const notes = gn(sem, sub.code, sc.key);
                                return `<div class="sub-cat-title">${sc.label}</div>${buildCategoryInner(notes)}`;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
            });
            return html;
        }

        function buildCategory(label, notes){
            return `<div class="note-category">
                <div class="note-cat-title">${label}</div>
                ${buildCategoryInner(notes)}
            </div>`;
        }

        // ✅ UPDATED: now includes "Open ↗" hint, quiet download button
        function buildCategoryInner(notes){
            if (!notes.length) return '<span class="no-files">Empty</span>';
            return notes.map(x => {
                const icon = getFileIcon(x.driveUrl);
                const dl = getDl(x.driveUrl);
                const nb = isNew(x.addedAt || 0) ? '<span class="new-badge">New</span>' : '';
                const safeLabel = (x.label || 'file').replace(/'/g, "\\'");
                return `<a class="file-link" data-drive-url="${x.driveUrl}" href="javascript:void(0)" title="Click to open in Google Drive">
                    <span class="file-icon">${icon}</span>
                    <span class="file-label">${x.label || 'File'}</span>
                    ${nb}
                    <span class="file-view-hint">Open ↗</span>
                    <button class="file-download-btn" onclick="event.stopPropagation();event.preventDefault();downloadFile('${dl}','${safeLabel}')" title="Download">↓</button>
                </a>`;
            }).join('');
        }

        document.getElementById('focusCloseBtn').addEventListener('click', () => closeFocus(true));
        focusOverlay.addEventListener('click', (e) => { if (e.target === focusOverlay) closeFocus(true); });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && focusOpen) { e.preventDefault(); closeFocus(true); }
        });

        window.addEventListener('popstate', () => {
            if (location.hash.startsWith('#subject=')) {
                const code = location.hash.replace('#subject=', '');
                const found = findSubjectByCode(code);
                if (found) openFocus(found.sem, code, false);
            } else if (focusOpen) {
                closeFocus(false);
            }
        });

        function maybeOpenFromHash(){
            if (location.hash.startsWith('#subject=')) {
                const code = location.hash.replace('#subject=', '');
                const found = findSubjectByCode(code);
                if (found) setTimeout(() => openFocus(found.sem, code, false), 250);
            }
        }

        // ── RENDER ──
        function renderAll(){renderSemesterNav();renderMobileNav();renderPanels();}
        function renderSemesterNav(){const n=document.getElementById('semesterNav');n.innerHTML='';for(let s=3;s<=8;s++){const b=document.createElement('button');b.className='sem-tab'+(s.toString()===cs&&!gf?' active':'');const d=SEMESTER_DATA[s];const t=(d.subjects?.length||0)+(d.electives?Object.values(d.electives).flat().length:0);b.innerHTML=`Sem ${s}<span class="badge">${t}</span>`;b.onclick=()=>{clearGlobalSearch();cs=s.toString();renderAll();};n.appendChild(b);}}
        function renderMobileNav(){const n=document.getElementById('mobileNavInner');n.innerHTML='';for(let s=3;s<=8;s++){const b=document.createElement('button');b.className='mobile-nav-btn'+(s.toString()===cs&&!gf?' active':'');b.innerHTML=`<span class="nav-icon">${s}</span>Sem ${s}`;b.onclick=()=>{clearGlobalSearch();cs=s.toString();renderAll();};n.appendChild(b);}}
        function applyGlobalSearch(){gf=document.getElementById('globalSearchInput').value.trim().toLowerCase();renderAll();}
        function clearGlobalSearch(){document.getElementById('globalSearchInput').value='';gf='';renderAll();}

        function renderPanels(){
            const mc=document.getElementById('mainContainer');const sk=document.getElementById('loadingSkeleton');if(sk)sk.style.display='none';mc.innerHTML='';
            if(gf){
                const all=[];
                for(let s=3;s<=8;s++){gas(s).forEach(sub=>{if(sub.title.toLowerCase().includes(gf)||sub.code.toLowerCase().includes(gf))all.push({sem:s,sub});});}
                mc.innerHTML=`<div class="semester-header"><h2 class="semester-title">Search Results</h2><p class="semester-subtitle">${all.length} subject${all.length===1?'':'s'} found</p></div><div class="subjects-grid">${all.map(x=>renderCard(x.sem,x.sub,0)).join('')}</div>`;
                attachListeners();return;
            }
            for(let s=3;s<=8;s++){const p=document.createElement('div');p.className='semester-panel';p.style.display=s.toString()===cs?'':'none';p.innerHTML=rsc(s);mc.appendChild(p);}
            attachListeners();
        }
        function rsc(sem){let h=`<div class="semester-header"><h2 class="semester-title">${SEMESTER_DATA[sem].name}</h2></div>`;h+='<div class="search-bar"><input type="text" placeholder="Filter subjects..." oninput="filterCards(this,\''+sem+'\')"></div>';h+=`<div class="subjects-grid" id="grid${sem}">`+rac(sem)+'</div>';return h;}
        function gas(sem){const d=SEMESTER_DATA[sem];let a=[...(d.subjects||[])];if(d.electives)Object.values(d.electives).forEach(arr=>a.push(...arr));return a;}
        function rac(sem){const d=SEMESTER_DATA[sem];let h='',si=0;if(d.subjects)d.subjects.forEach(s=>{h+=renderCard(sem,s,si);si++;});if(d.electives)for(const[g,ss]of Object.entries(d.electives)){h+=`<div class="elective-group-label">${g}</div>`;ss.forEach(s=>{h+=renderCard(sem,s,si);si++;});}return h;}
        function renderCard(sem,sub,si=0){
            const sc=si<16?` style="animation-delay:${si*0.04}s"`:'';
            return `<div class="subject-card card-enter" data-code="${sub.code}" data-sem="${sem}"${sc}>
                <div style="padding:1.2rem 1.4rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;">
                    <div style="flex:1;min-width:0;">
                        <div class="card-title" style="font-weight:700;font-size:1rem;line-height:1.4;">${sub.title}</div>
                        <div class="card-code" style="font-family:var(--font-mono);font-size:0.7rem;color:var(--text-muted);margin-top:0.25rem;letter-spacing:1px;text-transform:uppercase;">${sub.code}</div>
                    </div>
                    <span style="color:var(--text-muted);font-size:0.7rem;">→</span>
                </div>
            </div>`;
        }

        window.downloadFile=function(u,n){const a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();document.body.removeChild(a);showToast('Downloading...');};

        function attachListeners(){
            document.querySelectorAll('.subject-card').forEach(c=>{
                c.addEventListener('click', function(){
                    const sem = this.getAttribute('data-sem');
                    const code = this.getAttribute('data-code');
                    openFocus(sem, code, true);
                });
            });
            // ✅ UPDATED: click → open in Google Drive (new tab)
            document.querySelectorAll('.file-link[data-drive-url]').forEach(l=>{
                l.addEventListener('click', function(e){
                    if (e.target.closest('button')) return; // let ↓ handle downloads
                    e.stopPropagation();
                    openInDrive(this.getAttribute('data-drive-url'));
                });
            });
        }
        window.filterCards=function(i,s){const q=i.value.toLowerCase();document.querySelectorAll(`#grid${s} .subject-card`).forEach(c=>{c.style.display=(!q||c.querySelector('.card-title').textContent.toLowerCase().includes(q))?'':'none';});};

        document.addEventListener('keydown',function(e){
            if (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT') return;
            if (focusOpen) return;
            if (e.key>='3'&&e.key<='8'){e.preventDefault();clearGlobalSearch();cs=e.key;renderAll();showKcToast('Semester '+e.key);}
        });

        // ── ADMIN ──
        function openAdminModal(){
            document.getElementById('adminModalOverlay').classList.add('open');
            pas();
            if(ia){
                document.getElementById('adminAuth').style.display='none';
                document.getElementById('adminPanel').style.display='';
                uas();
                rae();
            } else {
                document.getElementById('adminAuth').style.display='';
                document.getElementById('adminPanel').style.display='none';
            }
        }
        function closeAdminModal(){document.getElementById('adminModalOverlay').classList.remove('open');}
        function openPreviewModal(){document.getElementById('previewModalOverlay').classList.add('open');}
        function closePreview(){document.getElementById('previewModalOverlay').classList.remove('open');document.getElementById('previewIframe').src='';document.getElementById('previewIframe').style.display='none';}
        document.getElementById('adminUploadBtn').addEventListener('click',openAdminModal);
        document.querySelectorAll('.modal-overlay').forEach(o=>{o.addEventListener('click',function(e){if(e.target===this){this.classList.remove('open');if(this.id==='previewModalOverlay')closePreview();}});});

        let ia=false,githubToken='';
        function adminLogin(){
            if(document.getElementById('adminPassword').value==='btadmin2024'&&(githubToken=document.getElementById('githubToken').value.trim())){
                ia=true;
                document.getElementById('adminAuth').style.display='none';
                document.getElementById('adminPanel').style.display='';
                uas();
                rae();
                showToast('Admin unlocked');
            } else showToast('Wrong password or token');
        }
        function adminLogout(){ia=false;document.getElementById('adminAuth').style.display='';document.getElementById('adminPanel').style.display='none';}

        function pas(){
            const s=document.getElementById('adminSemester');
            s.innerHTML='';
            for(let i=3;i<=8;i++){
                const o=document.createElement('option');
                o.value=i;
                o.textContent='Semester '+i;
                s.appendChild(o);
            }
        }

        function uas(){
            const semVal = document.getElementById('adminSemester').value;
            const sem = parseInt(semVal, 10);
            const d = SEMESTER_DATA[sem];
            const s = document.getElementById('adminSubject');
            s.innerHTML = '';
            if (!d) { console.warn('No SEMESTER_DATA for semester', semVal); return; }
            const all = [
                ...(d.subjects || []),
                ...(d.electives ? Object.values(d.electives).flat() : [])
            ];
            all.forEach(x => {
                const o = document.createElement('option');
                o.value = x.code;
                o.textContent = x.code + ' - ' + x.title;
                o.dataset.title = x.title;
                s.appendChild(o);
            });
            uaco();
        }

        function uaco(){
            const s = document.getElementById('adminCategory');
            const subSel = document.getElementById('adminSubject');
            const o = subSel.selectedOptions[0];
            const t = o ? (o.dataset.title || o.textContent.split(' - ')[1] || '') : '';
            let ac = [];
            if (isLab(t)) {
                ac = [...LIC];
            } else {
                ac = [...IC];
                GC.forEach(g => { g.sc.forEach(sc => ac.push(sc)); });
            }
            s.innerHTML = '';
            ac.forEach(x => {
                const e = document.createElement('option');
                e.value = x.key;
                e.textContent = x.label;
                s.appendChild(e);
            });
            rae();
        }

        window.updateAdminSubjects = uas;
        window.updateAdminCategoryOptions = uaco;

        function rae(){
            const n=gn(document.getElementById('adminSemester').value,document.getElementById('adminSubject').value,document.getElementById('adminCategory').value);
            const d=document.getElementById('adminExistingFiles');
            d.innerHTML=n.length?'':'No files yet.';
            n.forEach((x,i)=>{
                const e=document.createElement('div');
                e.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:0.2rem 0;';
                e.innerHTML=`<span>${x.label}</span><button style="background:#ef4444;color:#fff;border:none;border-radius:2px;width:20px;height:20px;cursor:pointer;font-size:0.55rem;">x</button>`;
                e.querySelector('button').onclick=()=>{
                    const k=gk(document.getElementById('adminSemester').value,document.getElementById('adminSubject').value,document.getElementById('adminCategory').value);
                    if(nd[k]){nd[k].splice(i,1);if(!nd[k].length)delete nd[k];sl();rae();renderPanels();showToast('Deleted');}
                };
                d.appendChild(e);
            });
        }

        async function ctg(){
            try{
                const c=JSON.stringify(nd,null,2);
                const b64=btoa(unescape(encodeURIComponent(c)));
                const gr=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/notes-data.json`,{headers:{Authorization:`token ${githubToken}`}});
                const fi=await gr.json();
                await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/notes-data.json`,{
                    method:'PUT',
                    headers:{Authorization:`token ${githubToken}`,'Content-Type':'application/json'},
                    body:JSON.stringify({message:'Update notes',content:b64,sha:fi.sha})
                });
                return true;
            }catch(e){return false;}
        }
        async function adminAddSingle(){
            const s=document.getElementById('adminSemester').value;
            const c=document.getElementById('adminSubject').value;
            const cat=document.getElementById('adminCategory').value;
            const l=document.getElementById('adminFileLabel').value.trim();
            const u=document.getElementById('adminDriveLink').value.trim();
            if(!l||!u)return showToast('Fill all fields');
            if(!extractFileId(u))return showToast('Invalid file link');
            const k=gk(s,c,cat);
            if(!nd[k])nd[k]=[];
            nd[k].push({label:l,driveUrl:u,addedAt:Date.now()});
            sl();
            const ok=await ctg();
            showToast(ok?'Published!':'Saved locally');
            document.getElementById('adminFileLabel').value='';
            document.getElementById('adminDriveLink').value='';
            rae();renderPanels();
        }
        async function adminAddBulk(){
            const s=document.getElementById('adminSemester').value;
            const c=document.getElementById('adminSubject').value;
            const cat=document.getElementById('adminCategory').value;
            const raw=document.getElementById('adminBulkLinks').value.trim();
            if(!raw)return showToast('Paste some links first');
            const lines=raw.split('\n').filter(l=>l.trim());
            let added=0;
            for(const line of lines){
                const parts=line.split('|');
                if(parts.length<2)continue;
                const label=parts[0].trim();
                const url=parts.slice(1).join('|').trim();
                if(!label||!url)continue;
                if(!extractFileId(url))continue;
                const k=gk(s,c,cat);
                if(!nd[k])nd[k]=[];
                nd[k].push({label,driveUrl:url,addedAt:Date.now()});
                added++;
            }
            if(!added)return showToast('No valid links found');
            sl();
            const ok=await ctg();
            showToast(ok?`${added} files published!`:`${added} files saved locally`);
            document.getElementById('adminBulkLinks').value='';
            rae();renderPanels();
        }
        window.adminAddSingle=adminAddSingle;
        window.adminAddBulk=adminAddBulk;
        function exportJSON(){const b=new Blob([JSON.stringify(nd,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='notes-data.json';a.click();}
        function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{nd=JSON.parse(ev.target.result);sl();renderPanels();rae();showToast('Imported');};r.readAsText(f);e.target.value='';}
        function refreshAdminExisting(){rae();}

        document.getElementById('quickViewBtn').addEventListener('click',()=>{document.getElementById('previewIframe').style.display='none';document.getElementById('quickViewInput').style.display='';openPreviewModal();});

        document.getElementById('themeToggle').addEventListener('click',()=>{document.body.classList.toggle('dark');document.body.classList.toggle('light');localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light');});

        fln();
    </script>

    <!-- ══ MOUSE EDGE NAV ══ -->
    <script>
    (function () {
        const PAGES=[{file:"index.html",name:"Home"},{file:"notes.html",name:"Notes"},{file:"events.html",name:"Events"},{file:"magazine.html",name:"Magazine"}];
        const currentFile=location.pathname.split("/").pop()||"index.html";
        const idx=PAGES.findIndex(p=>p.file===currentFile);if(idx===-1)return;
        const prev=PAGES[(idx-1+PAGES.length)%PAGES.length],next=PAGES[(idx+1)%PAGES.length];
        function makeEdge(side,target){const el=document.createElement("div");el.className=`rb-edge-nav ${side}`;el.innerHTML=`<svg class="edge-ring" viewBox="0 0 44 44" width="44" height="44"><circle cx="22" cy="22" r="20"></circle></svg><div class="edge-pill">${side==="left"?"◀":""}<span>${target.name}</span>${side==="right"?"▶":""}</div>`;document.body.appendChild(el);return el;}
        const leftNav=makeEdge("left",prev),rightNav=makeEdge("right",next);
        const DWELL_MS=900;let hoverStart=0,rafId=null,activeNav=null;
        function animateRing(nav,p){const c=nav.querySelector(".edge-ring circle");if(c)c.style.strokeDashoffset=String(126*(1-p));}
        function startDwell(nav,target){if(activeNav&&activeNav!==nav){const o=activeNav===leftNav?rightNav:leftNav;o.classList.remove("visible");animateRing(o,0);}activeNav=nav;nav.classList.add("visible");hoverStart=performance.now();function tick(now){const p=Math.min(1,(now-hoverStart)/DWELL_MS);animateRing(nav,p);if(p>=1){navigate(target);return;}rafId=requestAnimationFrame(tick);}cancelAnimationFrame(rafId);rafId=requestAnimationFrame(tick);}
        function stopDwell(nav){if(activeNav===nav){activeNav=null;animateRing(nav,0);}cancelAnimationFrame(rafId);setTimeout(()=>{if(activeNav!==nav)nav.classList.remove("visible");},200);}
        function navigate(target){if(document.body.classList.contains('focus-mode'))return;document.body.style.transition='opacity 0.3s';document.body.style.opacity='0';setTimeout(()=>{window.location.href=target.file;},280);}
        const TRIGGER=90;
        document.addEventListener("mousemove",(e)=>{if(document.body.classList.contains('focus-mode'))return;const w=window.innerWidth,x=e.clientX;if(x<TRIGGER){if(activeNav!==leftNav)startDwell(leftNav,prev);return;}if(x>w-TRIGGER){if(activeNav!==rightNav)startDwell(rightNav,next);return;}if(activeNav===leftNav)stopDwell(leftNav);if(activeNav===rightNav)stopDwell(rightNav);leftNav.classList.remove("visible");rightNav.classList.remove("visible");animateRing(leftNav,0);animateRing(rightNav,0);});
        leftNav.addEventListener("click",()=>navigate(prev));rightNav.addEventListener("click",()=>navigate(next));
    })();
    </script>
